name: SAT (SBCL)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sbcl gcc
      - name: Compile with no warnings or optimization notes
        run: sbcl --non-interactive --load sat/tests/compile-clean.lisp
      - name: Test Lisp API and numeric boundaries
        run: sbcl --script sat/tests/run.lisp
      - name: Compare with pinned C source and exhaustive oracle
        run: python3 sat/tests/differential.py --random 1000
      - name: Compare public-API proof output and check RUP
        run: python3 sat/tests/proofs.py
