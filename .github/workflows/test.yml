name: OOPArts validation

on:
  push:
    branches: [main, feat/portable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbcl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sbcl gcc
      - name: Check inferred layout and license inventories
        run: python3 tools/check-layout.py
      - name: Compile SAT with zero notes and warnings
        run: sbcl --non-interactive --load tools/sat/compile-clean.lisp
      - name: Run all library suites with a 1 MiB control stack
        run: sbcl --dynamic-space-size 2048 --control-stack-size 1 --script tools/test.lisp
      - name: Verify continuation FASL and saved-core reloads
        run: bash tools/continuation/test.sh
      - name: Compare SAT with C and exhaustive search
        run: python3 tools/sat/differential.py --random 1000
      - name: Compare proof bytes and independently check RUP
        run: python3 tools/sat/proofs.py
      - name: Run portable SAT backend and independent comparisons
        run: |
          python3 tools/lisp.py --portable-sat tools/test.lisp sat
          python3 tools/sat/differential.py --portable-sat --random 1000 --build-dir build/sat-portable --report build/sat-portable/results.json
          python3 tools/sat/proofs.py --portable-sat --build-dir build/sat-portable --report build/sat-portable/proofs.json
      - name: Test ISO driver isolation and classification
        run: ISO_SBCL=sbcl python3 -m unittest discover -s tests/prolog/iso -p 'test_*.py' -v
      - name: Validate native-model ISO observations
        run: python3 tools/prolog/iso/run.py --baseline tests/prolog/iso/expectations/baseline.json --strict --jobs 2
      - name: Validate strict term-model ISO observations
        run: python3 tools/prolog/iso/run.py --term-model iso --strict --jobs 2 --output build/prolog/iso-strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            tests/sat/reports/
            build/sat-portable/
            build/prolog/iso*/
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - id: matrix
        name: Evaluate available checks on each platform
        shell: bash
        run: |
          set -euo pipefail
          include='[]'
          for target in 'x86_64-linux ubuntu-24.04' 'aarch64-linux ubuntu-24.04-arm' 'aarch64-darwin macos-15'; do
            read -r system os <<< "$target"
            names=$(nix eval --json ".#checks.$system" --apply 'checks: builtins.deepSeq (builtins.mapAttrs (_: value: value.drvPath) checks) (builtins.attrNames checks)')
            include=$(jq -cn --argjson old "$include" --argjson names "$names" --arg os "$os" \
              '$old + ($names | map({os: $os, check: .}))')
          done
          test "$include" != '[]'
          echo "include=$include" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: ${{ matrix.os }} / ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Build library and run complete test suite
        run: nix build -L .#checks.$(nix eval --impure --raw --expr builtins.currentSystem).${{ matrix.check }}
